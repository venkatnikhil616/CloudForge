name: CloudTask CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Lint Tools
        run: |
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check .

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/

  container-build-scan:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api-gateway/Dockerfile
          push: false
          tags: cloudtask/api-gateway:latest

      - name: Build Task Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/task-service/Dockerfile
          push: false
          tags: cloudtask/task-service:latest

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/worker/Dockerfile
          push: false
          tags: cloudtask/worker:latest
