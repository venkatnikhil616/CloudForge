global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8001']

  - job_name: 'task-service'
    static_configs:
      - targets: ['task-service:8002']

  - job_name: 'worker'
    static_configs:
      - targets: ['worker:9091']

  - job_name: 'scheduler'
    static_configs:
      - targets: ['scheduler:9092']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:9093']
